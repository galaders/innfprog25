     // min kode for å finne lengste ord i en liste 

     //jeg laget mine egene koder i stedet for å kutte ned på koden som var der synes det jeg fant fram var en fin og kort en som funker bra

        // Liste med ord
         const ordListe = ["kode", "programmering", "design", "data", "variabel"]; // eksempel liste
        // Funksjon for å finne det lengste ordet i en liste
        // Bruker en array metode reduce for å finne lengste ord i listen
        // reduce går gjennom hvert ord i listen og sammenligner lengden for å finne det lengste
         const finnLengsteOrd = liste => liste.reduce((a, b) => a.length >= b.length ? a : b, ""); // bruker reduce for å finne lengste ord i listen 
        // Tester funksjonen og skriver ut resultatet
         console.log(`Det lengste ordet i listen er: ${finnLengsteOrd(ordListe)}`); // skriver ut lengste ord


         
     //min kode for gjennomsnittsalder 

        // Liste med personer og deres aldre
             const personers = [
            { navn: "Ola", alder: 24 },
            { navn: "Kari", alder: 32 },
            { navn: "Per", alder: 29 },
            { navn: "Anne", alder: 41 }
         ];
         
        // Funksjon for å beregne gjennomsnittet av en liste med tall  
        // samme kodebruk som ble brukt i arbeidskravet 2 oppgaven
        // Array.prototype.reduce brukes for å summere alle tallene i arrayet
        // Deretter deles summen på lengden av arrayet for å finne gjennomsnittet
         const calculateAverage = arr => arr.reduce((sum, value) => sum + value, 0) / arr.length; // bruker reduce for å summere og deler på lengden for å finne gjennomsnitt
        // Beregner og skriver ut gjennomsnittsalderen
         let gjennomsnitt = calculateAverage(personers.map(person => person.alder)); // mapper personers til en liste med aldre og beregner gjennomsnitt
        // Tester funksjonen og skriver ut resultatet
         console.log(`Gjennomsnittsalderen er ${gjennomsnitt}`); // skriver ut gjennomsnittsalder
