<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil App Forhåndsvisning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        html,
        body {
            background: transparent;
        }

        .phone-frame {
            width: min(400px, calc(100vw - 16px), calc(47.222dvh - 7.56px));
            aspect-ratio: 17 / 36;
        }

        /* Skjuler rullefelt men tillater rulling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Litt animasjon for app-ikoner når man hovrer (for effektens skyld) */
        .app-icon {
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .app-icon:active {
            transform: scale(0.9);
            filter: brightness(0.8);
        }
    </style>
</head>
<body class="bg-transparent min-h-screen flex items-center justify-center overflow-hidden font-sans text-black">

    <!-- Telefon Container -->
    <div class="phone-frame relative rounded-[3.5rem] bg-black border-[14px] border-black shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7),_0_0_0_2px_rgba(255,255,255,0.1)_inset] ring-1 ring-black/10 z-10 flex-shrink-0">
        
        <!-- Fysiske knapper på siden av telefonen -->
        <div class="absolute -left-[17px] top-[120px] w-[3px] h-[30px] bg-gray-800 rounded-l-md"></div> <!-- Lydløs -->
        <div class="absolute -left-[17px] top-[170px] w-[3px] h-[55px] bg-gray-800 rounded-l-md"></div> <!-- Volum Opp -->
        <div class="absolute -left-[17px] top-[240px] w-[3px] h-[55px] bg-gray-800 rounded-l-md"></div> <!-- Volum Ned -->
        <div class="absolute -right-[17px] top-[200px] w-[3px] h-[80px] bg-gray-800 rounded-r-md"></div> <!-- Strøm -->

        <!-- Notch (Busslomme / Kamera-område) -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[110px] h-[28px] bg-black rounded-b-3xl z-40 flex justify-end items-center px-4">
            <!-- Frontkamera linse -->
            <div class="w-3 h-3 bg-slate-900 rounded-full border border-slate-700/50 relative shadow-[inset_0_1px_2px_rgba(255,255,255,0.1)]">
                <div class="absolute top-[2px] right-[2px] w-[3px] h-[3px] bg-blue-400/40 rounded-full"></div>
            </div>
        </div>

        <!-- Skjerm -->
        <div class="w-full h-full rounded-[2.5rem] overflow-hidden relative bg-gradient-to-b from-blue-500 via-indigo-600 to-purple-800">
            
            <!-- Statuslinje (Topp) -->
            <div class="absolute top-0 w-full h-[40px] flex justify-between items-center px-6 pt-1 z-30 text-[11px] font-medium tracking-wide text-white drop-shadow-md">
                <span id="status-clock">12:00</span>
                <div class="flex items-center gap-1.5">
                    <i class="ph-fill ph-cell-signal-full text-sm"></i>
                    <i class="ph-bold ph-wifi-high text-sm"></i>
                    <i class="ph-fill ph-battery-full text-sm"></i>
                </div>
            </div>

            <!-- App-innhold (Rullbart) -->
            <div class="w-full h-full pt-16 pb-24 px-4 overflow-y-auto no-scrollbar relative z-20 flex flex-col gap-6">
                
                <!-- Vær og Klokke Widget -->
                <div class="bg-white/20 backdrop-blur-md rounded-3xl p-5 shadow-lg border border-white/20 text-white">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-medium opacity-90">Oslo, Norge</p>
                            <h1 id="main-clock" class="text-4xl font-light tracking-tight mt-1">12:00</h1>
                            <p id="date-display" class="text-xs opacity-75 mt-1">Mandag, 1. Jan</p>
                        </div>
                        <i class="ph-fill ph-cloud-sun text-4xl text-yellow-300 drop-shadow-md"></i>
                    </div>
                </div>

                <!-- App Rutenett -->
                <div class="grid grid-cols-4 gap-x-2 gap-y-6 text-center mt-2">
                    <!-- App 1 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-green-500 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-phone text-3xl text-white"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Telefon</span>
                    </div>
                    <!-- App 2 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-chat-teardrop-text text-3xl text-white"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Meldinger</span>
                    </div>
                    <!-- App 3 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-red-500 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-envelope-simple text-3xl text-white"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">E-post</span>
                    </div>
                    <!-- App 4 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-camera text-3xl text-gray-800"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Kamera</span>
                    </div>
                    
                    <!-- App 5 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-notebook text-3xl text-yellow-900"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Notater</span>
                    </div>
                    <!-- App 6 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-purple-500 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-music-notes text-3xl text-white"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Musikk</span>
                    </div>
                    <!-- App 7 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-cyan-500 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-cloud-sun text-3xl text-white"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Vær</span>
                    </div>
                    <!-- App 8 -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer">
                        <div class="w-14 h-14 bg-gray-800 rounded-2xl flex items-center justify-center shadow-md">
                            <i class="ph-fill ph-gear text-3xl text-white"></i>
                        </div>
                        <span class="text-[10px] drop-shadow-md">Innstillinger</span>
                    </div>
                </div>
                
                <!-- Ekstra utfyllende innhold for å tillate rulling -->
                <div class="mt-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/10">
                    <h3 class="text-xs font-semibold mb-2">Nyeste varsler</h3>
                    <div class="space-y-3">
                        <div class="flex gap-3 items-center">
                            <div class="w-8 h-8 rounded-full bg-blue-500 flex justify-center items-center">
                                <i class="ph-fill ph-twitter-logo text-white"></i>
                            </div>
                            <div class="text-xs">
                                <p class="font-semibold">Nye følgere</p>
                                <p class="opacity-70">3 personer fulgte deg nettopp.</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Bunndokk (Sticky i bunnen av skjermen) -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-[90%] h-[76px] bg-white/20 backdrop-blur-xl border border-white/20 rounded-[2rem] z-30 flex justify-between items-center px-4 shadow-lg">
                <div class="w-[50px] h-[50px] bg-green-500 rounded-2xl flex items-center justify-center app-icon cursor-pointer">
                     <i class="ph-fill ph-phone text-2xl text-white"></i>
                </div>
                <div class="w-[50px] h-[50px] bg-blue-500 rounded-2xl flex items-center justify-center app-icon cursor-pointer">
                    <i class="ph-fill ph-compass text-2xl text-white"></i>
                </div>
                <div class="w-[50px] h-[50px] bg-orange-500 rounded-2xl flex items-center justify-center app-icon cursor-pointer">
                    <i class="ph-fill ph-chat-teardrop-text text-2xl text-white"></i>
                </div>
                <div class="w-[50px] h-[50px] bg-gray-200 rounded-2xl flex items-center justify-center app-icon cursor-pointer">
                    <i class="ph-fill ph-faders text-2xl text-gray-800"></i>
                </div>
            </div>

            <!-- Hjem-indikator (Den lille streken nederst) -->
            <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-1/3 h-1 bg-white rounded-full z-40"></div>

        </div>
    </div>

    <script>
        function updateClock() {
            const nå = new Date();
            
            // Formater tid (HH:MM)
            let timer = nå.getHours().toString().padStart(2, '0');
            let minutter = nå.getMinutes().toString().padStart(2, '0');
            let tidsStreng = `${timer}:${minutter}`;
            
            // Oppdater klokker i UI
            document.getElementById('status-clock').textContent = tidsStreng;
            document.getElementById('main-clock').textContent = tidsStreng;
            
            // Formater dato (f.eks. Mandag, 1. Jan)
            const dager = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag'];
            const måneder = ['Jan', 'Feb', 'Mar', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Des'];
            
            let ukedag = dager[nå.getDay()];
            let dag = nå.getDate();
            let måned = måneder[nå.getMonth()];
            
            document.getElementById('date-display').textContent = `${ukedag}, ${dag}. ${måned}`;
        }

        // Kjør med en gang, og deretter hvert sekund
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
