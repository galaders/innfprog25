<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Mockup</title>
    
    <!-- Laster inn Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Laster inn Phosphor Icons for moderne ikoner -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Skjuler den standard rullebaren men bevarer rullefunksjonaliteten */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Klikkanimasjon for app-ikoner */
        .app-icon {
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .app-icon:active {
            transform: scale(0.92);
            filter: brightness(0.85);
        }
    </style>
</head>

<body class="bg-transparent min-h-screen flex items-center justify-center font-sans text-black overflow-hidden m-0 p-4">

    <!-- Telefonens ytre skall -->
    <div class="relative w-[350px] h-[740px] rounded-[3.5rem] bg-black border-[14px] border-black shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5),_0_0_0_2px_rgba(255,255,255,0.05)_inset] ring-1 ring-black/10 z-10 flex-shrink-0">
        
        <!-- Lydløs-bryter -->
        <div class="absolute -left-[17px] top-[120px] w-[3px] h-[30px] bg-gray-800 rounded-l-md shadow-inner"></div>
        <!-- Volum Opp -->
        <div class="absolute -left-[17px] top-[170px] w-[3px] h-[55px] bg-gray-800 rounded-l-md shadow-inner"></div>
        <!-- Volum Ned -->
        <div class="absolute -left-[17px] top-[240px] w-[3px] h-[55px] bg-gray-800 rounded-l-md shadow-inner"></div>
        <!-- Strømknapp -->
        <div class="absolute -right-[17px] top-[200px] w-[3px] h-[80px] bg-gray-800 rounded-r-md shadow-inner"></div>

        <!-- Notch (Kamerahakket på toppen) -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120px] h-[30px] bg-black rounded-b-[1.5rem] z-40 flex justify-end items-center px-4">
            <!-- Kameralinse -->
            <div class="w-4 h-4 bg-gray-900 rounded-full border border-gray-700/50 relative shadow-[inset_0_1px_2px_rgba(255,255,255,0.1)] flex items-center justify-center">
                <div class="w-1.5 h-1.5 bg-blue-900/60 rounded-full"></div>
            </div>
        </div>

        <!-- Selve skjermen -->
        <div class="w-full h-full rounded-[2.5rem] overflow-hidden relative bg-gradient-to-br from-indigo-500 via-purple-600 to-pink-500 text-white shadow-[inset_0_0_20px_rgba(0,0,0,0.2)]">
            
            <!-- Statuslinje -->
            <div class="absolute top-0 w-full h-[44px] flex justify-between items-center px-6 z-30 text-[12px] font-semibold tracking-wider drop-shadow-md">
                <span id="status-clock" class="pl-2">00:00</span>
                <div class="flex items-center gap-1.5 pr-1">
                    <i class="ph-fill ph-cell-signal-full text-[15px]"></i>
                    <i class="ph-bold ph-wifi-high text-[15px]"></i>
                    <i class="ph-fill ph-battery-full text-[16px]"></i>
                </div>
            </div>

            <!-- Innhold (rullbart grensesnitt) -->
            <div class="w-full h-full pt-16 pb-28 px-5 overflow-y-auto no-scrollbar relative z-20 flex flex-col gap-8">
                
                <!-- Stor klokke og dato-widget -->
                <div class="flex flex-col items-center mt-6 drop-shadow-lg">
                    <i class="ph-fill ph-cloud-sun text-5xl text-yellow-300 mb-2"></i>
                    <h1 id="main-clock" class="text-6xl font-light tracking-tighter">00:00</h1>
                    <p id="date-display" class="text-sm font-medium opacity-90 mt-1">Laster dato...</p>
                </div>

                <!-- App Rutenett (Grid) -->
                <div class="grid grid-cols-4 gap-x-4 gap-y-6 text-center">
                    <!-- App 1: Telefon -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-green-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-green-400 transition-colors">
                            <i class="ph-fill ph-phone text-3xl text-white"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Telefon</span>
                    </div>
                    <!-- App 2: Meldinger -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-blue-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-blue-400 transition-colors">
                            <i class="ph-fill ph-chat-circle-text text-3xl text-white"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Meldinger</span>
                    </div>
                    <!-- App 3: E-post -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-blue-400 rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-blue-300 transition-colors">
                            <i class="ph-fill ph-envelope-simple text-3xl text-white"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">E-post</span>
                    </div>
                    <!-- App 4: Kamera -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-gray-200 rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-gray-100 transition-colors">
                            <i class="ph-fill ph-camera text-3xl text-gray-800"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Kamera</span>
                    </div>
                    
                    <!-- App 5: Bilder -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-white rounded-2xl flex items-center justify-center shadow-lg overflow-hidden relative">
                            <div class="absolute inset-0 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-500 opacity-20"></div>
                            <i class="ph-fill ph-image text-3xl text-purple-600 z-10"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Bilder</span>
                    </div>
                    <!-- App 6: Musikk -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-[#fc3c44] rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-red-400 transition-colors">
                            <i class="ph-fill ph-music-notes text-3xl text-white"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Musikk</span>
                    </div>
                    <!-- App 7: Vær -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-sky-500 rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-sky-400 transition-colors">
                            <i class="ph-fill ph-sun-horizon text-3xl text-white"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Vær</span>
                    </div>
                    <!-- App 8: Innstillinger -->
                    <div class="flex flex-col items-center gap-1.5 app-icon cursor-pointer group">
                        <div class="w-[60px] h-[60px] bg-gray-700 rounded-2xl flex items-center justify-center shadow-lg group-hover:bg-gray-600 transition-colors">
                            <i class="ph-fill ph-gear text-3xl text-white"></i>
                        </div>
                        <span class="text-[11px] font-medium drop-shadow-md">Innstilling</span>
                    </div>
                </div>

                <!-- Varslings-widget for utfylling/rulling -->
                <div class="mt-2 bg-white/20 backdrop-blur-md rounded-3xl p-4 shadow-sm border border-white/30">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold uppercase tracking-wider opacity-80">Varsler</h3>
                        <i class="ph-bold ph-x text-xs opacity-60"></i>
                    </div>
                    <div class="flex gap-4 items-center bg-white/10 p-3 rounded-2xl">
                        <div class="w-10 h-10 rounded-full bg-blue-500 flex justify-center items-center flex-shrink-0 shadow-inner">
                            <i class="ph-fill ph-twitter-logo text-white text-lg"></i>
                        </div>
                        <div class="text-sm">
                            <p class="font-bold">Ny oppdatering</p>
                            <p class="opacity-80 text-xs leading-tight">Appen din er ferdig generert med HTML og CSS.</p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- App-Dock nederst -->
            <div class="absolute bottom-5 left-1/2 -translate-x-1/2 w-[92%] h-[84px] bg-white/20 backdrop-blur-xl border border-white/30 rounded-[2.2rem] z-30 flex justify-between items-center px-4 shadow-2xl">
                <!-- Dock App 1 -->
                <div class="w-[56px] h-[56px] bg-green-500 rounded-[1.1rem] flex items-center justify-center app-icon cursor-pointer shadow-md">
                     <i class="ph-fill ph-phone text-3xl text-white"></i>
                </div>
                <!-- Dock App 2 -->
                <div class="w-[56px] h-[56px] bg-blue-500 rounded-[1.1rem] flex items-center justify-center app-icon cursor-pointer shadow-md">
                    <i class="ph-fill ph-safari-logo text-3xl text-white"></i>
                </div>
                <!-- Dock App 3 -->
                <div class="w-[56px] h-[56px] bg-orange-500 rounded-[1.1rem] flex items-center justify-center app-icon cursor-pointer shadow-md">
                    <i class="ph-fill ph-chat-teardrop-text text-3xl text-white"></i>
                </div>
                <!-- Dock App 4 -->
                <div class="w-[56px] h-[56px] bg-gradient-to-br from-pink-500 to-orange-400 rounded-[1.1rem] flex items-center justify-center app-icon cursor-pointer shadow-md">
                    <i class="ph-fill ph-instagram-logo text-3xl text-white"></i>
                </div>
            </div>

            <!-- Hjem-indikator (den hvite streken nederst) -->
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-1/3 h-[4px] bg-white rounded-full z-40 opacity-80 shadow-sm"></div>

        </div>
    </div>

    <script>
        /**
         * Oppdaterer klokken og datoen i brukergrensesnittet.
         */
        function updateTime() {
            const now = new Date();
            
            // Hent timer og minutter, formatert med to siffer
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;
            
            // Oppdater klokkene
            document.getElementById('status-clock').innerText = timeString;
            document.getElementById('main-clock').innerText = timeString;
            
            // Formater dato for Norge (f.eks. Lørdag 26. September)
            const days = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag'];
            const months = ['Januar', 'Februar', 'Mars', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Desember'];
            
            const dayName = days[now.getDay()];
            const dayNumber = now.getDate();
            const monthName = months[now.getMonth()];
            
            document.getElementById('date-display').innerText = `${dayName} ${dayNumber}. ${monthName}`;
        }

        // Kjør umiddelbart for å unngå forsinkelse
        updateTime();
        
        // Oppdater klokken hvert sekund
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
